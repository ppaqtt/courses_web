<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#667eea">
    <meta name="description" content="Hello World、文件读写、HTTP 请求、并发：37 门编程语言并排对照，支持在线运行。">
    <link rel="stylesheet" href="tutorial-style.css">
    <link rel="stylesheet" href="tutorial-pages.css">
    <style>
        .compare-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border-radius: var(--radius-lg);
            padding: 36px 30px;
            margin-bottom: 24px;
        }
        .compare-header h1 { margin: 0 0 10px; font-size: 2rem; }
        .compare-header p { margin: 0; opacity: .92; }

        .task-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }
        .task-tab {
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            padding: 10px 18px;
            border-radius: 999px;
            cursor: pointer;
            font-size: .95rem;
            transition: all .2s ease;
        }
        .task-tab:hover { border-color: var(--accent-color); color: var(--accent-color); }
        .task-tab.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #fff;
            box-shadow: var(--shadow-sm);
        }

        .task-desc {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 16px 20px;
            margin-bottom: 20px;
            color: var(--text-secondary);
            box-shadow: var(--shadow-sm);
        }

        .lang-picker {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 22px;
            align-items: center;
        }
        .lang-picker strong { margin-right: 4px; color: var(--text-secondary); }
        .lang-chip {
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            padding: 6px 13px;
            border-radius: 999px;
            cursor: pointer;
            font-size: .85rem;
        }
        .lang-chip.active {
            border-color: var(--accent-color);
            color: var(--accent-color);
            background: rgba(102, 126, 234, .1);
            font-weight: 600;
        }

        .compare-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
            gap: 18px;
        }
        @media (max-width: 640px) {
            .compare-grid { grid-template-columns: 1fr; }
        }
        .compare-card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .compare-card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-secondary);
        }
        .compare-card-head h3 { margin: 0; font-size: 1.05rem; }
        .compare-card-head .actions { display: flex; gap: 8px; }
        .compare-card pre {
            margin: 0;
            padding: 18px;
            background: var(--code-bg);
            color: var(--code-text);
            font-family: 'JetBrains Mono', Consolas, Monaco, monospace;
            font-size: .82rem;
            line-height: 1.65;
            overflow-x: auto;
            flex: 1;
        }
        .compare-card .card-output {
            padding: 12px 18px;
            font-size: .8rem;
            border-top: 1px solid var(--border-color);
            background: #0b1120;
            color: #cbd5e1;
            white-space: pre-wrap;
        }
        .compare-card .card-output.success { color: #86efac; }
        .compare-card .card-output.error { color: #fca5a5; }
        .compare-card .run-fallback {
            margin: 10px 18px 16px;
            padding: 10px 12px;
            border-radius: 8px;
            background: rgba(245, 158, 11, .12);
            color: #b45309;
            font-size: .78rem;
        }
        .note { color: var(--text-muted); font-size: .8rem; text-align: center; margin-top: 22px; }
    </style>
</head>
<body>
    <div class="container">

        <header class="compare-header">
            <h1>🔀 语言对照</h1>
            <p>同一个任务，用不同语言怎么写？看语法差异，也看标准库与并发模型的取舍。</p>
        </header>

        <div class="task-tabs" id="taskTabs"></div>
        <div class="task-desc" id="taskDesc"></div>
        <div class="lang-picker" id="langPicker"></div>
        <div class="compare-grid" id="compareGrid"></div>

        <p class="note">代码示例优先用标准库；HTTP / 并发等任务在部分语言中需第三方库，已在注释中标明。在线运行依赖 Piston 公共 API，不可用时自动降级为复制代码。</p>
    </div>

    <script src="language-catalog.js"></script>
    <script src="tutorial-runner.js?v=20261115"></script>
    <script>
        const TASKS = [
            {
                id: 'hello',
                icon: '👋',
                title: 'Hello World',
                desc: '最小可运行程序：观察入口函数、输出语句与语句分隔符的差异。'
            },
            {
                id: 'file',
                icon: '📁',
                title: '文件读写',
                desc: '逐行读取 input.txt、统计行数并写出 output.txt：观察文件 API 与错误处理方式。'
            },
            {
                id: 'http',
                icon: '🌐',
                title: 'HTTP 请求',
                desc: 'GET https://example.com，打印状态码与响应长度：观察标准库 / 第三方库的选择。'
            },
            {
                id: 'concurrency',
                icon: '⚡',
                title: '并发',
                desc: '并发启动 3 个任务并等待全部完成：观察线程、协程、Actor 与 OpenMP 的差异。'
            }
        ];

        const LANGS = [
            { key: 'python', name: 'Python', runner: 'python' },
            { key: 'javascript', name: 'JavaScript', runner: 'javascript' },
            { key: 'java', name: 'Java', runner: 'java' },
            { key: 'cpp', name: 'C++', runner: 'cpp' },
            { key: 'go', name: 'Go', runner: 'go' },
            { key: 'rust', name: 'Rust', runner: 'rust' },
            { key: 'haskell', name: 'Haskell', runner: 'haskell' },
            { key: 'elixir', name: 'Elixir', runner: 'elixir' },
            { key: 'fortran', name: 'Fortran', runner: 'fortran' },
            { key: 'cobol', name: 'COBOL', runner: 'cobol' }
        ];

        const SNIPPETS = {
            hello: {
                python: 'print("Hello, World!")',
                javascript: 'console.log("Hello, World!");',
                java: `public class Main {
    public static void main(String[] args) {
        System.out.println("Hello, World!");
    }
}`,
                cpp: `#include <iostream>
int main() {
    std::cout << "Hello, World!" << std::endl;
    return 0;
}`,
                go: `package main

import "fmt"

func main() {
    fmt.Println("Hello, World!")
}`,
                rust: `fn main() {
    println!("Hello, World!");
}`,
                haskell: `main :: IO ()
main = putStrLn "Hello, World!"`,
                elixir: 'IO.puts("Hello, World!")',
                fortran: `program hello
  implicit none
  print '(A)', 'Hello, World!'
end program hello`,
                cobol: `       IDENTIFICATION DIVISION.
       PROGRAM-ID. HELLO.
       PROCEDURE DIVISION.
           DISPLAY "Hello, World!".
           STOP RUN.`
            },
            file: {
                python: `with open("input.txt", encoding="utf-8") as f:
    lines = f.readlines()
print("行数:", len(lines))
with open("output.txt", "w", encoding="utf-8") as f:
    f.writelines(lines)`,
                javascript: `const fs = require("fs");
const lines = fs.readFileSync("input.txt", "utf8").split(/\\r?\\n/);
console.log("行数:", lines.length);
fs.writeFileSync("output.txt", lines.join("\\n"));`,
                java: `import java.nio.file.*;
import java.util.List;

public class Main {
    public static void main(String[] args) throws Exception {
        List<String> lines = Files.readAllLines(Path.of("input.txt"));
        System.out.println("行数: " + lines.size());
        Files.write(Path.of("output.txt"), lines);
    }
}`,
                cpp: `#include <fstream>
#include <iostream>
#include <string>

int main() {
    std::ifstream in("input.txt");
    std::ofstream out("output.txt");
    std::string line;
    int count = 0;
    while (std::getline(in, line)) {
        ++count;
        out << line << "\\n";
    }
    std::cout << "行数: " << count << "\\n";
}`,
                go: `package main

import (
    "bufio"
    "fmt"
    "os"
)

func main() {
    in, _ := os.Open("input.txt")
    defer in.Close()
    out, _ := os.Create("output.txt")
    defer out.Close()
    scanner := bufio.NewScanner(in)
    count := 0
    for scanner.Scan() {
        count++
        fmt.Fprintln(out, scanner.Text())
    }
    fmt.Println("行数:", count)
}`,
                rust: `use std::fs;

fn main() -> std::io::Result<()> {
    let text = fs::read_to_string("input.txt")?;
    println!("行数: {}", text.lines().count());
    fs::write("output.txt", &text)?;
    Ok(())
}`,
                haskell: `main :: IO ()
main = do
  content <- readFile "input.txt"
  let ls = lines content
  putStrLn ("行数: " ++ show (length ls))
  writeFile "output.txt" content`,
                elixir: `content = File.read!("input.txt")
lines = String.split(content, "\\n", trim: true)
IO.puts("行数: #{length(lines)}")
File.write!("output.txt", content)`,
                fortran: `program file_demo
  implicit none
  integer :: count
  character(len=256) :: line
  count = 0
  open(unit=10, file='input.txt', status='old', action='read')
  do
    read(10, '(A)', end=99) line
    count = count + 1
  end do
99 close(10)
  print '(A,I0)', '行数: ', count
end program file_demo`,
                cobol: `       IDENTIFICATION DIVISION.
       PROGRAM-ID. FILE-DEMO.
       ENVIRONMENT DIVISION.
       INPUT-OUTPUT SECTION.
       FILE-CONTROL.
           SELECT IN-FILE ASSIGN TO "input.txt"
               ORGANIZATION IS LINE SEQUENTIAL.
       DATA DIVISION.
       FILE SECTION.
       FD IN-FILE.
       01 IN-REC PIC X(256).
       WORKING-STORAGE SECTION.
       01 WS-COUNT PIC 9(6) VALUE 0.
       01 WS-EOF PIC X VALUE "N".
       PROCEDURE DIVISION.
           OPEN INPUT IN-FILE
           PERFORM UNTIL WS-EOF = "Y"
               READ IN-FILE
                   AT END MOVE "Y" TO WS-EOF
                   NOT AT END ADD 1 TO WS-COUNT
               END-READ
           END-PERFORM
           CLOSE IN-FILE
           DISPLAY "行数: " WS-COUNT
           STOP RUN.`
            },
            http: {
                python: `import urllib.request

with urllib.request.urlopen("https://example.com", timeout=10) as r:
    body = r.read().decode("utf-8")
print("状态码:", r.status, "长度:", len(body))`,
                javascript: `fetch("https://example.com")
  .then(r => r.text().then(body =>
    console.log("状态码:", r.status, "长度:", body.length)))
  .catch(err => console.error(err.message));`,
                java: `import java.net.URI;
import java.net.http.*;

public class Main {
    public static void main(String[] args) throws Exception {
        HttpClient client = HttpClient.newHttpClient();
        HttpRequest req = HttpRequest.newBuilder(
            URI.create("https://example.com")).build();
        HttpResponse<String> res = client.send(req,
            HttpResponse.BodyHandlers.ofString());
        System.out.println("状态码: " + res.statusCode()
            + " 长度: " + res.body().length());
    }
}`,
                cpp: `// 需要 libcurl：g++ main.cpp -lcurl
#include <curl/curl.h>
#include <iostream>
#include <string>

static size_t writeCb(void* ptr, size_t size, size_t nmemb, std::string* out) {
    out->append((char*)ptr, size * nmemb);
    return size * nmemb;
}

int main() {
    CURL* curl = curl_easy_init();
    std::string body;
    curl_easy_setopt(curl, CURLOPT_URL, "https://example.com");
    curl_easy_setopt(curl, CURLOPT_WRITEFUNCTION, writeCb);
    curl_easy_setopt(curl, CURLOPT_WRITEDATA, &body);
    CURLcode rc = curl_easy_perform(curl);
    if (rc == CURLE_OK) std::cout << "长度: " << body.size() << "\\n";
    curl_easy_cleanup(curl);
}`,
                go: `package main

import (
    "fmt"
    "io"
    "net/http"
)

func main() {
    res, err := http.Get("https://example.com")
    if err != nil {
        fmt.Println("请求失败:", err)
        return
    }
    defer res.Body.Close()
    body, _ := io.ReadAll(res.Body)
    fmt.Println("状态码:", res.StatusCode, "长度:", len(body))
}`,
                rust: `// Cargo.toml: reqwest = { version = "0.11", features = ["blocking"] }
fn main() -> Result<(), Box<dyn std::error::Error>> {
    let res = reqwest::blocking::get("https://example.com")?;
    let status = res.status();
    let body = res.text()?;
    println!("状态码: {} 长度: {}", status, body.len());
    Ok(())
}`,
                haskell: `-- 需要 http-client 包
{-# LANGUAGE OverloadedStrings #-}
import Network.HTTP.Simple
import qualified Data.ByteString.Lazy.Char8 as L

main :: IO ()
main = do
  res <- httpLBS "https://example.com"
  let body = L.unpack (getResponseBody res)
  putStrLn ("状态码: " ++ show (getResponseStatusCode res)
            ++ " 长度: " ++ show (length body))`,
                elixir: `:inets.start()

{:ok, {{_, status, _}, _headers, body}} =
  :httpc.request(:get, {'https://example.com', []}, [],
                 body_format: :binary)
IO.puts("状态码: #{status} 长度: #{byte_size(body)}")`,
                fortran: `program http_demo
  implicit none
  integer :: rc
  ! 标准库不含 HTTP，调用系统 curl
  call execute_command_line( &
    'curl -s -o body.txt -w "%{http_code}" https://example.com', &
    exitstat=rc)
  print '(A,I0)', 'curl 退出码: ', rc
  print '(A)', '响应已保存到 body.txt'
end program http_demo`,
                cobol: `       IDENTIFICATION DIVISION.
       PROGRAM-ID. HTTP-DEMO.
       DATA DIVISION.
       WORKING-STORAGE SECTION.
       01 WS-CMD PIC X(120).
       PROCEDURE DIVISION.
           STRING "curl -s -o body.txt https://example.com"
               DELIMITED BY SIZE INTO WS-CMD
           CALL "SYSTEM" USING WS-CMD
           DISPLAY "响应已保存到 body.txt"
           STOP RUN.`
            },
            concurrency: {
                python: `import threading

def worker(i):
    print(f"worker {i} 完成")

threads = [threading.Thread(target=worker, args=(i,)) for i in range(3)]
for t in threads:
    t.start()
for t in threads:
    t.join()`,
                javascript: `const tasks = [0, 1, 2].map(i =>
  new Promise(resolve => setTimeout(() => {
    console.log(\`worker \${i} 完成\`);
    resolve();
  }, 100))
);
Promise.all(tasks).then(() => console.log("全部完成"));`,
                java: `import java.util.concurrent.*;

public class Main {
    public static void main(String[] args) throws Exception {
        ExecutorService pool = Executors.newFixedThreadPool(3);
        for (int i = 0; i < 3; i++) {
            final int id = i;
            pool.submit(() -> System.out.println("worker " + id + " 完成"));
        }
        pool.shutdown();
        pool.awaitTermination(5, TimeUnit.SECONDS);
    }
}`,
                cpp: `#include <iostream>
#include <thread>
#include <vector>

int main() {
    std::vector<std::thread> pool;
    for (int i = 0; i < 3; ++i) {
        pool.emplace_back([i] {
            std::cout << "worker " << i << " 完成\\n";
        });
    }
    for (auto& t : pool) t.join();
}`,
                go: `package main

import (
    "fmt"
    "sync"
)

func main() {
    var wg sync.WaitGroup
    for i := 0; i < 3; i++ {
        wg.Add(1)
        go func(id int) {
            defer wg.Done()
            fmt.Println("worker", id, "完成")
        }(i)
    }
    wg.Wait()
}`,
                rust: `use std::thread;

fn main() {
    let handles: Vec<_> = (0..3).map(|i| {
        thread::spawn(move || println!("worker {} 完成", i))
    }).collect();
    for h in handles {
        h.join().unwrap();
    }
}`,
                haskell: `-- 需要 async 包
import Control.Concurrent.Async

main :: IO ()
main = do
  done <- forConcurrently [0..2 :: Int] $ \\i -> do
    putStrLn ("worker " ++ show i ++ " 完成")
    pure i
  print done`,
                elixir: `1..3
|> Enum.map(fn i ->
  Task.async(fn -> IO.puts("worker #{i} 完成") end)
end)
|> Task.await_many()
IO.puts("全部完成")`,
                fortran: `program parallel_demo
  use omp_lib
  implicit none
  integer :: i
  ! 编译：gfortran -fopenmp parallel.f90
  !$omp parallel do
  do i = 1, 3
    print '(A,I0,A)', 'worker ', i, ' 完成'
  end do
  !$omp end parallel do
end program parallel_demo`,
                cobol: `       IDENTIFICATION DIVISION.
       PROGRAM-ID. BATCH-DEMO.
       DATA DIVISION.
       WORKING-STORAGE SECTION.
       01 WS-JOB PIC 9 VALUE 0.
       PROCEDURE DIVISION.
      * COBOL 通常用多进程 / JCL 并行作业，而非线程
           PERFORM VARYING WS-JOB FROM 1 BY 1 UNTIL WS-JOB > 3
               DISPLAY "worker " WS-JOB " 完成"
           END-PERFORM
           STOP RUN.`
            }
        };

        let currentTask = 'hello';
        let selected = ['python', 'javascript', 'java', 'go', 'rust', 'haskell', 'elixir', 'fortran', 'cobol'];

        function renderTabs() {
            document.getElementById('taskTabs').innerHTML = TASKS.map(task => `
                <button class="task-tab ${task.id === currentTask ? 'active' : ''}"
                        data-task="${task.id}">
                    ${task.icon} ${task.title}
                </button>
            `).join('');
            document.querySelectorAll('.task-tab').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentTask = btn.dataset.task;
                    render();
                });
            });
            const task = TASKS.find(t => t.id === currentTask);
            document.getElementById('taskDesc').textContent = task.desc;
        }

        function renderPicker() {
            document.getElementById('langPicker').innerHTML =
                '<strong>对照语言：</strong>' + LANGS.map(lang => `
                    <button class="lang-chip ${selected.includes(lang.key) ? 'active' : ''}"
                            data-lang="${lang.key}">${lang.name}</button>
                `).join('');
            document.querySelectorAll('.lang-chip').forEach(btn => {
                btn.addEventListener('click', () => {
                    const key = btn.dataset.lang;
                    if (selected.includes(key)) {
                        if (selected.length > 1) selected = selected.filter(k => k !== key);
                    } else {
                        selected.push(key);
                    }
                    render();
                });
            });
        }

        function renderCards() {
            const grid = document.getElementById('compareGrid');
            grid.innerHTML = selected.map(key => {
                const lang = LANGS.find(l => l.key === key);
                const code = (SNIPPETS[currentTask] || {})[key] || '// 暂无示例';
                return `
                    <article class="compare-card" data-lang="${key}">
                        <div class="compare-card-head">
                            <h3>${lang.name}</h3>
                            <div class="actions">
                                <button class="btn primary run-btn" data-lang="${key}">▶ 运行</button>
                                <button class="btn ghost copy-btn" data-lang="${key}">复制</button>
                            </div>
                        </div>
                        <pre><code>${escapeHtml(code)}</code></pre>
                        <div class="card-output" hidden></div>
                    </article>
                `;
            }).join('');

            grid.querySelectorAll('.run-btn').forEach(btn => {
                btn.addEventListener('click', () => runSnippet(btn.dataset.lang));
            });
            grid.querySelectorAll('.copy-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const code = SNIPPETS[currentTask][btn.dataset.lang] || '';
                    navigator.clipboard.writeText(code).then(() => {
                        btn.textContent = '已复制';
                        setTimeout(() => { btn.textContent = '复制'; }, 1500);
                    });
                });
            });
        }

        function escapeHtml(text) {
            return String(text).replace(/&/g, '&amp;')
                .replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        async function runSnippet(key) {
            const card = document.querySelector(`.compare-card[data-lang="${key}"]`);
            const output = card.querySelector('.card-output');
            const code = SNIPPETS[currentTask][key];
            output.hidden = false;
            output.className = 'card-output';
            output.textContent = '运行中...';

            if (!window.CodeRunner) {
                output.textContent = '在线运行模块未加载，请复制代码到本地运行。';
                return;
            }
            let result;
            try {
                result = await CodeRunner.runInto(output, key, code);
            } catch (error) {
                result = { ok: false, output: error.message };
            }
            if (!result || !result.ok) {
                output.classList.add('error');
                const fallback = document.createElement('div');
                fallback.className = 'run-fallback';
                fallback.textContent = '在线执行不可用，已降级为复制代码。';
                const copy = document.createElement('button');
                copy.className = 'btn ghost';
                copy.textContent = '📋 复制代码';
                copy.style.marginLeft = '8px';
                copy.addEventListener('click', () => navigator.clipboard.writeText(code));
                fallback.appendChild(copy);
                output.appendChild(fallback);
            }
        }

        function render() {
            renderTabs();
            renderPicker();
            renderCards();
        }

        render();
    </script>
</body>
